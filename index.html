<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATCH TRUMPET - Flappy Bird Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border: 4px solid #2c3e50;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
        }

        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #2c3e50;
            font-size: 24px;
            z-index: 10;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .score-display {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px 0px #2c3e50;
            z-index: 10;
        }

        /* Start Screen */
        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        .start-screen h1 {
            font-size: 64px;
            color: #e74c3c;
            text-shadow: 4px 4px 0px #c0392b;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .game-over-screen h2 {
            font-size: 56px;
            color: #e74c3c;
            text-shadow: 4px 4px 0px #c0392b;
            margin-bottom: 20px;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            text-align: center;
            margin: 20px 0;
        }

        .instructions h3 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #f39c12;
        }

        .instructions p {
            font-size: 24px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .instructions .example {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            font-size: 28px;
            border-radius: 5px;
        }

        .avoid-example {
            background: #fff;
            color: #2c3e50;
        }

        .collect-example {
            background: #000;
            color: #000;
            border: 2px solid #fff;
        }

        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 20px 60px;
            font-family: 'VT323', monospace;
            font-size: 36px;
            cursor: pointer;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.1s;
            margin-top: 30px;
        }

        .btn:hover {
            background: #c0392b;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #a93226;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #a93226;
        }

        .final-score {
            font-size: 72px;
            color: #f39c12;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        /* Mobile controls hint */
        .mobile-hint {
            position: absolute;
            bottom: 20px;
            font-size: 20px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui-overlay">
            <div>HIGH SCORE: <span id="highScore">0</span></div>
        </div>
        
        <div class="score-display">
            <span id="score">0</span>
        </div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>CATCH TRUMPET</h1>
            <div class="instructions">
                <h3>HOW TO PLAY</h3>
                <p><strong>Press SPACE or CLICK to fly!</strong></p>
                <p style="margin-top: 20px;">
                    <span class="example avoid-example">REGULAR WORDS</span> = AVOID! ☠️
                </p>
                <p>
                    <span class="example collect-example">██████</span> = COLLECT! ✓
                </p>
                <p style="margin-top: 15px; color: #3498db;">
                    Touch the REDACTED black boxes for points<br>
                    Avoid the white words or game over!
                </p>
            </div>
            <button class="btn" onclick="startGame()">START GAME</button>
            <p class="mobile-hint">Tap screen or press SPACE to jump</p>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen hidden" id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div class="final-score">
                SCORE: <span id="finalScore">0</span>
            </div>
            <p style="font-size: 28px; margin: 10px 0;">
                Redacted Collected: <span id="collectedCount" style="color: #f39c12;">0</span>
            </p>
            <button class="btn" onclick="restartGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let highScore = localStorage.getItem('catchTrumpetHighScore') || 0;
        let collectedRedacted = 0;
        let frameCount = 0;
        let gameSpeed = 3;
        
        // Update high score display
        document.getElementById('highScore').textContent = highScore;

        // Word banks
        const regularWords = [
            "Island", "Estate", "Ranch", "Palm Beach", "Paris", "Manhattan",
            "Gulfstream", "Boeing", "Pilot", "Flight", "JFK", "Passenger",
            "Trust", "Fund", "Bank", "Wire", "Transfer", "Account",
            "Meeting", "Schedule", "Email", "Document", "Memo",
            "Secretary", "Assistant", "Manager", "Lunch", "Dinner",
            "Camera", "Video", "Photo", "Phone", "Laptop"
        ];

        const redactedWords = [
            "Epstein", "Maxwell", "Clinton", "Trump", "Andrew",
            "Flight Logs", "Little Black Book", "Victim Names", "Client List",
            "Island Visits", "Private Jet", "Lolita Express", "Pedophile",
            "Sex Trafficking", "Underage Girls", "Massage", "Recruitment",
            "NDA Settlement", "Legal Threats", "Cover Up"
        ];

        // Player (Trumpet character)
        const player = {
            x: 150,
            y: 300,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.5,
            jumpStrength: -10,
            rotation: 0,
            emoji: '🎺'
        };

        // Obstacles array
        let obstacles = [];
        let redactedItems = [];
        let particles = [];

        // Background clouds
        let clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 200,
                speed: 0.5 + Math.random() * 0.5,
                size: 30 + Math.random() * 20
            });
        }

        // Input handling
        function jump() {
            if (gameState === 'playing') {
                player.velocity = player.jumpStrength;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'playing') {
                    jump();
                } else if (gameState === 'gameover') {
                    restartGame();
                }
            }
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'playing') jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'playing') {
                jump();
            }
        });

        // Spawn obstacles
        function spawnObstacle() {
            const word = regularWords[Math.floor(Math.random() * regularWords.length)];
            const y = Math.random() * (canvas.height - 100) + 50;
            
            obstacles.push({
                x: canvas.width,
                y: y,
                word: word,
                width: ctx.measureText(word).width + 20,
                height: 40,
                passed: false
            });
        }

        // Spawn redacted items
        function spawnRedacted() {
            const word = redactedWords[Math.floor(Math.random() * redactedWords.length)];
            const y = Math.random() * (canvas.height - 100) + 50;
            
            redactedItems.push({
                x: canvas.width,
                y: y,
                word: word,
                width: 120,
                height: 40,
                collected: false
            });
        }

        // Create particles
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color: color
                });
            }
        }

        // Update game
        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            // Update player
            player.velocity += player.gravity;
            player.y += player.velocity;
            player.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, player.velocity * 0.05));

            // Check boundaries
            if (player.y < 0) {
                player.y = 0;
                player.velocity = 0;
            }
            if (player.y > canvas.height - player.height) {
                gameOver();
            }

            // Update clouds
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -100) {
                    cloud.x = canvas.width + 100;
                    cloud.y = Math.random() * 200;
                }
            });

            // Spawn obstacles and redacted items
            if (frameCount % 90 === 0) {
                if (Math.random() < 0.7) spawnObstacle();
            }
            if (frameCount % 120 === 0) {
                spawnRedacted();
            }

            // Update obstacles
            obstacles = obstacles.filter(obs => {
                obs.x -= gameSpeed;

                // Check collision with player
                if (!obs.passed &&
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    gameOver();
                }

                return obs.x > -200;
            });

            // Update redacted items
            redactedItems = redactedItems.filter(item => {
                if (item.collected) return false;
                
                item.x -= gameSpeed;

                // Check collection
                if (player.x < item.x + item.width &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.height &&
                    player.y + player.height > item.y) {
                    
                    item.collected = true;
                    score += 50;
                    collectedRedacted++;
                    createParticles(item.x + item.width/2, item.y + item.height/2, '#f39c12');
                    document.getElementById('score').textContent = score;
                    
                    // Speed up slightly
                    if (collectedRedacted % 5 === 0) {
                        gameSpeed += 0.2;
                    }
                    
                    return false;
                }

                return item.x > -200;
            });

            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                return p.life > 0;
            });
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw gradient sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.5, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x - cloud.size * 0.5, cloud.y - cloud.size * 0.1, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });

            if (gameState === 'playing' || gameState === 'gameover') {
                // Draw obstacles (regular words - WHITE, avoid these!)
                ctx.font = 'bold 24px "VT323", monospace';
                ctx.textAlign = 'center';
                obstacles.forEach(obs => {
                    // Word background
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(obs.x - 10, obs.y - 10, ctx.measureText(obs.word).width + 20, 40);
                    
                    // Word border
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x - 10, obs.y - 10, ctx.measureText(obs.word).width + 20, 40);
                    
                    // Word text
                    ctx.fillStyle = '#2c3e50';
                    ctx.fillText(obs.word, obs.x + ctx.measureText(obs.word).width / 2, obs.y + 20);
                });

                // Draw redacted items (BLACK boxes - collect these!)
                redactedItems.forEach(item => {
                    if (!item.collected) {
                        // Black redacted box
                        ctx.fillStyle = '#000';
                        ctx.fillRect(item.x, item.y, item.width, item.height);
                        
                        // Border
                        ctx.strokeStyle = '#e74c3c';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(item.x, item.y, item.width, item.height);
                        
                        // Glow effect
                        ctx.shadowColor = '#e74c3c';
                        ctx.shadowBlur = 10;
                        ctx.shadowBlur = 0;
                    }
                });

                // Draw player (Trumpet emoji)
                ctx.save();
                ctx.translate(player.x + player.width/2, player.y + player.height/2);
                ctx.rotate(player.rotation);
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.emoji, 0, 0);
                ctx.restore();

                // Draw particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 30;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            gameState = 'playing';
            score = 0;
            collectedRedacted = 0;
            frameCount = 0;
            gameSpeed = 3;
            
            player.y = 300;
            player.velocity = 0;
            
            obstacles = [];
            redactedItems = [];
            particles = [];
            
            document.getElementById('score').textContent = '0';
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        // Game over
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('catchTrumpetHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('collectedCount').textContent = collectedRedacted;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // Restart game
        function restartGame() {
            startGame();
        }

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
